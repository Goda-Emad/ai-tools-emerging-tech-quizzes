<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz – AI Tools & Emerging Technologies</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="quiz-layout">
<div class="container container--narrow">

  <!-- ===== HERO HEADER ===== -->
  <header class="hero">
    <div class="hero-content">

      <!-- Left: back + title -->
      <div class="hero-left">
        <a href="index.html" class="back-btn" title="Back to Home">←</a>
        <div class="hero-text">
          <h1 class="quiz-title" id="quizTitle">Loading…</h1>
          <span class="subtitle" id="quizSubtitle"></span>
        </div>
      </div>

      <!-- Right: live stats -->
      <div class="hero-right">
        <div class="hero-stat">
          <span class="number success" id="scoreDisplay">0</span>
          <span class="label">Score</span>
        </div>
        <div class="hero-stat">
          <span class="number" id="answeredDisplay">0</span>
          <span class="label">Answered</span>
        </div>
        <div class="hero-stat">
          <span class="number" id="totalDisplay">0</span>
          <span class="label">Total</span>
        </div>
      </div>

    </div>
  </header>

  <!-- ===== QUIZ AREA ===== -->
  <main>

    <!-- Jump panel injected by JS above quiz-container -->

    <!-- Quiz card -->
    <div class="quiz-container">

      <!-- Progress bar -->
      <div class="progress-section">
        <div class="progress-header">
          <span id="progressLabel">Question 1 of 30</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- Question header -->
      <div class="question-header">
        <span class="q-number" id="qNumber">Q1</span>
        <span class="q-status" id="qStatus">⬜ Not answered</span>
      </div>

      <!-- Question text -->
      <div class="question-text" id="questionText">Loading question…</div>

      <!-- Options / Answer area -->
      <div class="options-grid" id="optionsContainer"></div>

      <!-- Explanation (shown after Get Final Score) -->
      <div class="explanation-box" id="explanationBox">
        <div class="exp-title" id="expTitle"></div>
        <div class="exp-body"  id="expBody"></div>
      </div>

      <!-- Navigation row -->
      <div class="nav-section">
        <button class="nav-btn" id="prevBtn" disabled>← Previous</button>
        <span   class="nav-counter" id="navCounter">1 / 30</span>
        <button class="nav-btn" id="nextBtn">Next →</button>
      </div>

      <!-- Action row -->
      <div class="nav-section action-row">
        <button class="nav-btn success" id="submitBtn">
          ✅ Get Final Score &amp; Feedback
        </button>
        <button class="nav-btn danger" id="resetBtn">
          🔄 Reset
        </button>
      </div>

    </div><!-- /.quiz-container -->

    <!-- Keyboard hint injected by JS -->

    <!-- ===== RESULTS PANEL ===== -->
    <div class="results-container" id="resultsContainer">
      <div class="results-card">

        <span class="trophy">🏆</span>
        <div class="score-label">Your Final Score</div>

        <div class="big-score">
          <span id="finalScoreNum">0</span><span class="score-fraction">&thinsp;/&thinsp;<span id="finalScoreTotal">0</span></span>
        </div>

        <div class="results-percentage" id="finalScorePercent">0%</div>

        <div class="results-stats">
          <div class="rstat">
            <span class="rnum green"  id="finalCorrect">0</span>
            <span class="rlabel">✅ Correct</span>
          </div>
          <div class="rstat">
            <span class="rnum red"    id="finalWrong">0</span>
            <span class="rlabel">❌ Incorrect</span>
          </div>
          <div class="rstat">
            <span class="rnum yellow" id="finalUnanswered">0</span>
            <span class="rlabel">⚠️ Unanswered</span>
          </div>
        </div>

        <div class="results-actions">
          <button class="nav-btn primary" id="reviewBtn">👁️ Review Answers</button>
          <button class="nav-btn"         id="resultsResetBtn">🔄 Retry</button>
          <a      class="nav-btn" href="index.html" style="text-decoration:none;">🏠 Home</a>
        </div>

      </div>
    </div><!-- /.results-container -->

  </main>

</div><!-- /.container -->
<script src="script.js"></script>
</body>
</html>
